<!doctype html>
<!--
  GEO 기초 AIPBL 실습용 목업 사이트 (개선 전, 모바일 웹).
  가상의 복숭아 농장 "모모팜" 상품 상세 페이지. 제품명과 가격만 텍스트이고
  상세 정보 전체가 이미지 한 장이라, 크롤러와 AI가 읽을 근거 문장이 없다는 것을
  보여 주는 교재다. 사진: Wikimedia Commons (자유 라이선스).
-->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>모모팜 : 산지직송 복숭아</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif; background: #ffffff; color: #17181c; padding-bottom: 84px; }
    .topbar { background: #000000; color: #ffffff; text-align: center; font-size: 11px; padding: 8px 12px; }
    .topbar b { text-decoration: underline; font-weight: 600; }
    header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: #ffffff; border-bottom: 1px solid #f0f0f2; }
    .menu { font-size: 18px; color: #17181c; }
    .logo { font-size: 21px; font-weight: 900; letter-spacing: -0.03em; color: #000000; }
    .hicons { margin-left: auto; display: flex; gap: 13px; font-size: 16px; }
    .crumb { padding: 14px 18px 0; font-size: 12px; color: #9ca3af; }
    .crumb b { color: #17181c; font-weight: 500; }
    .newsletter { margin: 26px 16px 6px; background: #000000; border-radius: 20px; padding: 24px 20px; }
    .newsletter .n-title { color: #ffffff; font-size: 22px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 16px; }
    .newsletter .n-input { background: #ffffff; border-radius: 999px; padding: 11px 16px; font-size: 13px; color: #9ca3af; margin-bottom: 10px; }
    .newsletter .n-btn { background: #ffffff; border-radius: 999px; padding: 11px 16px; font-size: 13px; font-weight: 700; text-align: center; }
    .hero { margin: 12px 16px 0; border-radius: 20px; overflow: hidden; background: #f0eeed; }
    .hero img { display: block; width: 100%; height: auto; }
    .product { padding: 18px 18px 6px; }
    .badges span { display: inline-block; padding: 5px 12px; border-radius: 999px; background: #f0f0f2; color: #17181c; font-size: 11px; font-weight: 700; margin-right: 6px; }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 10px 0 6px; }
    .rating { font-size: 13px; color: #6b7280; margin-bottom: 12px; }
    .rating .stars { color: #ffc633; letter-spacing: 2px; }
    .rating b { color: #17181c; }
    .price { display: flex; align-items: baseline; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid #f0f0f2; }
    .price strong { font-size: 24px; font-weight: 800; }
    .price del { font-size: 16px; font-weight: 700; color: #c4c4c4; }
    .price .off { font-size: 12px; font-weight: 700; color: #ff3333; background: rgba(255, 51, 51, 0.1); border-radius: 999px; padding: 4px 10px; }
    .price span.ship { font-size: 13px; color: #9ca3af; margin-left: auto; }
    .detail-label { padding: 18px 18px 10px; font-size: 15px; font-weight: 700; }
    .detail img { display: block; width: 100%; height: auto; }
    footer { padding: 26px 18px; font-size: 12px; color: #9ca3af; background: #fafafa; border-top: 1px solid #f0f0f2; }
    .cta { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 12px 18px; background: #ffffff; border-top: 1px solid #f0f0f2; }
    .cta .like { width: 52px; border: 1px solid #e5e7eb; border-radius: 14px; background: #ffffff; font-size: 18px; }
    .cta .buy { flex: 1; border: 0; border-radius: 14px; background: #17181c; color: #ffffff; font-size: 15px; font-weight: 700; padding: 14px 0; }
  </style>
</head>
<body>
  <div class="topbar">여름 복숭아 시즌 오픈, 첫 주문 <b>10% 할인</b></div>
  <header>
    <span class="menu" aria-hidden>&#9776;</span>
    <span class="logo">모모팜</span>
    <span class="hicons" aria-hidden><span>&#128269;</span><span>&#128722;</span></span>
  </header>
  <nav class="crumb">홈 &gt; 과일 &gt; <b>복숭아</b></nav>

  <div class="hero">
    <img src="/ai-practice/mock/img/hero-peach.webp" alt="" />
  </div>

  <section class="product">
    <p class="badges"><span>산지직송</span><span>당일 수확</span></p>
    <h1>모모팜 딱딱이 복숭아 4.5kg</h1>
    <p class="rating"><span class="stars" aria-hidden>&#9733;&#9733;&#9733;&#9733;&#9733;</span> <b>4.9/5</b> (후기 128개)</p>
    <p class="price"><strong>32,000원</strong><del>39,000원</del><span class="off">-18%</span><span class="ship">무료배송</span></p>
  </section>

  <p class="detail-label">상세정보</p>
  <!-- 상세 정보 전체가 이미지 한 장. 당도, 발송, 재구매율 근거가 모두 이미지 안에만 있다. -->
  <div class="detail">
    <img src="/ai-practice/mock/momofarm-detail.png" alt="" />
  </div>

  <div class="newsletter">
    <p class="n-title">복숭아 시즌<br />소식 받기</p>
    <div class="n-input">&#9993; 이메일 주소 입력</div>
    <div class="n-btn">시즌 오픈 알림 신청</div>
  </div>

  <footer>
    <p>고객센터 010-2345-6789</p>
    <p>© 모모팜</p>
  </footer>

  <div class="cta">
    <button type="button" class="like" aria-label="찜하기">&#9825;</button>
    <button type="button" class="buy">구매하기</button>
  </div>
</body>
</html>
