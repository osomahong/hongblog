name: 데이터 마트 대시보드 배포

# bigquery/dm/dashboard 안의 결과물만 GitHub Pages로 올린다.
# 저장소의 다른 파일(docs/의 내부 문서 등)은 올리지 않는다.
on:
  push:
    branches: [main]
    paths:
      - 'bigquery/dm/dashboard/index.html'
      - 'bigquery/dm/dashboard/robots.txt'
      - '.github/workflows/dashboard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 배포할 파일만 모으기
        run: |
          mkdir -p _site
          cp bigquery/dm/dashboard/index.html _site/index.html
          cp bigquery/dm/dashboard/robots.txt _site/robots.txt
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
